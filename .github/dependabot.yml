version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Etc/UTC
    groups:
      github-actions:
        patterns:
          - "*"
    open-pull-requests-limit: 5
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:30"
      timezone: Etc/UTC
    groups:
      android-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /preview
    schedule:
      interval: weekly
      day: monday
      time: "07:00"
      timezone: Etc/UTC
    groups:
      preview-dependencies:
        patterns:
          - "*"
    open-pull-requests-limit: 5
